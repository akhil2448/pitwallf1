<div class="race-selection-page">
  <div class="page-header">
    <div class="back-home" (click)="goHome()">← HOME</div>

    <div class="hero-track-outline">
      <img src="assets/tracks/suzuka-outline.svg" alt="" />
    </div>

    <div class="page-brand">
      <img
        class="page-logo"
        src="assets/icons/logo-transparent.webp"
        alt="PitWall Logo"
      />

      <div class="page-title">PITWALL</div>
    </div>

    <div class="title-accent"></div>

    <div class="page-tagline">Replay Formula 1 Races</div>
  </div>

  <div class="header-toolbar">
    <div class="mobile-home" (click)="goHome()">← HOME</div>

    <div class="toolbar-spacer"></div>

    <div class="season-bar">
      <span class="season-bar-label">SEASON</span>

      <app-pw-select
        class="year-selector"
        [options]="yearOptions"
        [value]="selectedYear"
        (valueChange)="onYearSelected($event)"
      ></app-pw-select>
    </div>

    <div class="support-me-button">
      <app-support-button text="Support PitWall"> </app-support-button>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">Loading schedule...</div>

  <div *ngIf="error" class="error-state">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error" class="race-grid">
    <div class="race-card" *ngFor="let race of races">
      <div class="round-row">
        <div class="round-label">ROUND {{ race.round }}</div>

        <div class="session-availability">
          <div class="availability-item">
            <!-- TO CHECK THE FAKE UNAVAILABLE CASE -->
            <!-- <ng-container [ngSwitch]="null">
              <span
                *ngSwitchDefault
                class="status-unavailable"
                role="img"
                aria-label="Qualifying session data availability unknown"
                title="Qualifying session data availability unknown"
              ></span>
            </ng-container> -->

            <ng-container [ngSwitch]="race.qualifyingDataStatus">
              <span
                *ngSwitchCase="'complete'"
                class="status-light status-light--complete"
                role="img"
                aria-label="Qualifying data complete"
              ></span>

              <span
                *ngSwitchCase="'failed'"
                class="status-light status-light--failed"
                role="img"
                aria-label="Qualifying data failed"
              ></span>

              <span
                *ngSwitchDefault
                class="status-unavailable"
                role="img"
                aria-label="Qualifying session data availability unknown"
                title="Qualifying session data availability unknown"
              ></span>
            </ng-container>

            <span class="availability-label">QUALIFYING</span>
          </div>

          <div class="availability-item">
            <ng-container [ngSwitch]="race.raceDataStatus">
              <span
                *ngSwitchCase="'complete'"
                class="status-light status-light--complete"
                role="img"
                aria-label="Race data complete"
              ></span>

              <span
                *ngSwitchCase="'failed'"
                class="status-light status-light--failed"
                role="img"
                aria-label="Race data failed"
              ></span>

              <span
                *ngSwitchDefault
                class="status-unavailable"
                role="img"
                aria-label="Race session data availability unknown"
                title="Race session data availability unknown"
              ></span>
            </ng-container>

            <span class="availability-label">RACE</span>
          </div>
        </div>
      </div>

      <div class="race-header">
        <div class="race-info">
          <div class="race-name">
            {{ race.raceName }}
          </div>

          <div class="location">{{ race.location }}, {{ race.country }}</div>
        </div>

        <img
          class="country-flag"
          [src]="getFlagUrl(race.country)"
          [alt]="race.country"
        />
      </div>

      <div class="session-block">
        <div class="session-title">QUALIFYING</div>

        <div class="session-time">
          {{ race.qualifyingLocalDisplay }}
        </div>
      </div>

      <div class="session-block">
        <div class="session-title">RACE</div>

        <div class="session-time">
          {{ race.raceLocalDisplay }}
        </div>
      </div>

      <div class="race-actions">
        <button
          class="lab-button simulation-button"
          (click)="openSimulationLab(race)"
        >
          SIMULATION LAB
        </button>

        <button
          class="lab-button performance-button"
          (click)="openPerformanceLab(race)"
        >
          PERFORMANCE LAB
        </button>
      </div>
    </div>
  </div>
</div>
